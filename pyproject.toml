[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.6.1"]
build-backend = "scikit_build_core.build"

[project]
name = "histogram-node-study"
version = "0.1.0"
description = "Matched histogram lookup nodes for the CorrectionLib plugin SDK"
requires-python = ">=3.9"
dependencies = [
  "correctionlib @ git+https://github.com/gordonwatts/correctionlib.git@3e907fd9eb4fe1d5946dcd161c68b2fdd2b341a5",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."correctionlib.nodes"]
"study.hist.binary" = "histogram_nodes:provider"
"study.hist.linear" = "histogram_nodes:provider"
"study.hist.tree" = "histogram_nodes:provider"
"study.hist.unrolled" = "histogram_nodes:provider"
"study.hist.arithmetic" = "histogram_nodes:provider"
"study.hist.float32_unrolled" = "histogram_nodes:provider"
"study.hist.float32_arithmetic" = "histogram_nodes:provider"
"study.hist.binary_batch" = "histogram_nodes:provider"
"study.hist.linear_batch" = "histogram_nodes:provider"
"study.hist.tree_batch" = "histogram_nodes:provider"
"study.hist.unrolled_batch" = "histogram_nodes:provider"
"study.hist.arithmetic_batch" = "histogram_nodes:provider"
"study.hist.float32_unrolled_batch" = "histogram_nodes:provider"
"study.hist.float32_arithmetic_batch" = "histogram_nodes:provider"
"study.hist.binary_packed" = "histogram_nodes:provider"
"study.hist.linear_packed" = "histogram_nodes:provider"
"study.hist.tree_packed" = "histogram_nodes:provider"
"study.hist.unrolled_packed" = "histogram_nodes:provider"
"study.hist.arithmetic_packed" = "histogram_nodes:provider"
"study.hist.float32_unrolled_packed" = "histogram_nodes:provider"
"study.hist.float32_arithmetic_packed" = "histogram_nodes:provider"

[tool.scikit-build]
wheel.packages = ["python/histogram_nodes"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
